# =============================================================================
# Apolo Zenith 1.9 — Configuração Central Arquitetural
# Suporta perfis dimensionáveis: 125M, 350M, 1B, 3B, 7B, 13B, 34B, 70B, 120B, 199B
# =============================================================================

system:
  name: "Apolo Zenith 1.9"
  version: "1.9.0"
  target_hardware: "arm64_mobile_and_distributed_cluster"
  active_profile: "mobile_proto_125m" # Seleção ativa para hardware local

# -----------------------------------------------------------------------------
# Definição dos Perfis de Escala
# -----------------------------------------------------------------------------
profiles:
  # Perfil padrão de pesquisa executável no dispositivo móvel (ARM Cortex-A78/A55)
  mobile_proto_125m:
    d_model: 512
    num_layers: 6
    num_heads: 8
    num_kv_heads: 2
    head_dim: 64
    d_ffn: 1024
    num_experts: 8
    num_experts_per_tok: 2
    num_shared_experts: 1
    max_position_embeddings: 4096
    vocab_size: 32000
    aux_loss_coef: 0.01

  mobile_proto_350m:
    d_model: 768
    num_layers: 12
    num_heads: 12
    num_kv_heads: 4
    head_dim: 64
    d_ffn: 1536
    num_experts: 8
    num_experts_per_tok: 2
    num_shared_experts: 1
    max_position_embeddings: 8192
    vocab_size: 32000
    aux_loss_coef: 0.01

  scale_7b:
    d_model: 4096
    num_layers: 32
    num_heads: 32
    num_kv_heads: 8
    head_dim: 128
    d_ffn: 11008
    num_experts: 16
    num_experts_per_tok: 4
    num_shared_experts: 1
    max_position_embeddings: 32768
    vocab_size: 64000
    aux_loss_coef: 0.01

  scale_70b:
    d_model: 8192
    num_layers: 48
    num_heads: 64
    num_kv_heads: 8
    head_dim: 128
    d_ffn: 16384
    num_experts: 32
    num_experts_per_tok: 4
    num_shared_experts: 1
    max_position_embeddings: 65536
    vocab_size: 128000
    aux_loss_coef: 0.01

  # Perfil Alvo Canônico do Apolo Zenith 1.9 (199B Sparse MoE)
  scale_199b:
    d_model: 8192
    num_layers: 64
    num_heads: 64
    num_kv_heads: 8
    head_dim: 128
    d_ffn: 4096
    num_experts: 64
    num_experts_per_tok: 8
    num_shared_experts: 1
    max_position_embeddings: 131072
    vocab_size: 128000
    aux_loss_coef: 0.01
    total_parameters_target: 199000000000
    active_parameters_per_token: 32000000000

# -----------------------------------------------------------------------------
# Módulos Multimodais e Encoders
# -----------------------------------------------------------------------------
multimodal:
  latent_dim: 512
  vision:
    image_size: 256
    patch_size: 16
    in_channels: 3
    vision_embed_dim: 512
  video:
    temporal_frames: 16
    fps: 24
    spatial_resolution: 256
    latent_compression_factor: 8
  audio:
    sample_rate: 24000
    n_mels: 80
    audio_embed_dim: 512

# -----------------------------------------------------------------------------
# Motor de Geração de Imagem & Vídeo (Flow Matching / DiT)
# -----------------------------------------------------------------------------
generation:
  flow_matching:
    time_steps: 25
    euler_solver: true
    guidance_scale: 4.5

  image:
    latent_channels: 4
    vae_downsample: 4
    qualities: ["preview", "standard", "high", "ultra", "8k"]
    resolutions:
      preview: 512
      standard: 1024
      high: 2048
      ultra: 4096
      8k: 8192

  video:
    latent_channels: 4
    spatial_factor: 4
    temporal_factor: 4
    fps: 24
    quality: "8k"
    qualities: ["preview", "standard", "high", "ultra", "8k"]
    resolution:
      width: 7680
      height: 4320
    generation:
      # resolução nativa adaptativa: o pipeline calcula a resolução
      # intermediária viável e completa com super-resolução generativa
      base_resolution: "adaptive"
    output:
      width: 7680
      height: 4320
    aspect_ratios: ["16:9", "9:16", "1:1", "4:3", "3:4", "21:9"]
    super_resolution:
      stages: 3
      tile_size: 256
      overlap: 32
  camera:
    supported_motions:
      - "dolly_in"
      - "dolly_out"
      - "pan_left"
      - "pan_right"
      - "tilt_up"
      - "tilt_down"
      - "zoom_in"
      - "zoom_out"
      - "orbit_cw"
      - "orbit_ccw"
      - "crane_up"
      - "crane_down"
      - "static"

# -----------------------------------------------------------------------------
# Sistema Multi-Agente & Roteamento de Ferramentas
# -----------------------------------------------------------------------------
agents:
  max_iterations: 15
  auto_reflection: true
  roles:
    - "architect"
    - "senior_developer"
    - "code_reviewer"
    - "debugger"
    - "security_engineer"
    - "cinematographer"
    - "audio_engineer"
    - "qa_engineer"
  tools:
    sandbox_timeout_seconds: 30
    max_memory_mb: 2048
    allowed_tools:
      - "shell"
      - "python"
      - "file_system"
      - "git"
      - "http"
